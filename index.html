<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Tic Tac Toe</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>

<body>
  <div id="game__board">
    <h1>Cozy Tic Tac Toe</h1>
    <div class="div__player">
      <label class="player__name">Player X: </label>
      <label id="player_x_score">0</label>
    </div>
    <div class="div__player">
      <label class="player__name">Player O: </label>
      <label id="player_o_score">0</label>
    </div>
    <div id="turn">
      <label>Next Turn: </label>
      <label id="next__turn">X</label>
    </div>

    <div id="tic_tac_toe_background">
      <div id="tic_tac_toe_board">
        <div class="tic_tac_toe_square">
          <img id="pos-1" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-2" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-3" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-4" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-5" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-6" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-7" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-8" class="icon" alt="">
        </div>
        <div class="tic_tac_toe_square">
          <img id="pos-9" class="icon" alt="">
        </div>
      </div>
    </div>
    <button id="reset" type="reset">Reset Game</button>
  </div>

  <script src="./build/index.js"></script>
</body>

</html>
